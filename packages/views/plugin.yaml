manifest_version: 2
api_version: 1
name: kaizen-views
version: "1.0.0"
description: >-
  Draws interactive views in the Hermes Desktop and Webapp chat, with a text fallback for other clients. Two
  toolsets, enabled separately: a2ui (a2ui_present: A2UI Express compiled to A2UI 1.0, or 1.0 / v0.9 JSON;
  needs the a2ui-agent-sdk Python package) and openui (openui_present: OpenUI Lang views and live dashboards).
  Disclosure: no network calls of its own, subprocesses or credentials. A view can load http or https images
  the model names, LAN hosts included. Reads the local image files the model names and stores a copy in that
  view's file. An OpenUI dashboard on screen reads the MCP tools the user lists in dashboard_sources, through
  Hermes' own MCP client; nothing is read until the user lists a source. Saves each view in the plugin's data
  folder, keeping the newest 500 and at most 2 GB, plus one backend id file. Clicking a view sends a message
  in that chat.
author: Revenue-Architect
license: MIT
homepage: https://github.com/Revenue-Architect/hermes-kaizen-ui
requires_hermes: ">=0.23.0"
provides_tools:
  - a2ui_present
  - openui_present
provides_hooks:
  - pre_llm_call
  - transform_llm_output
requires_env: []
