manifest_version: 2
api_version: 1
name: kaizen-theme
version: "1.1.0"
description: >-
  Woday-inspired Kaizen theme for Hermes Desktop and the Webapp: dark navigation,
  rounded paper and charcoal workspaces, Hanken Grotesk and restrained signal red.
  Disclosure: no network, subprocesses, credentials or agent tools. Navigation
  and command search use native app actions; CSS layout hooks may need updates
  when Desktop's structure changes.
author: Revenue-Architect
license: MIT
homepage: https://github.com/Revenue-Architect/hermes-kaizen-ui
requires_hermes: ">=0.23.0"
provides_tools: []
provides_hooks: []
requires_env: []
