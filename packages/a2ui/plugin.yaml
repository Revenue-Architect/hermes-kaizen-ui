manifest_version: 2
api_version: 1
name: hermes-a2ui
version: "1.1.1"
description: >-
  Draws interactive A2UI v0.9 views in the Hermes Desktop and Webapp chat, with one validated tool and
  a text fallback for other clients. Disclosure: no network calls of its own, subprocesses or credentials.
  A view can load https images the model names. Reads the local image files the model names and stores a
  copy in that view's file. Saves each view in the plugin's data folder, keeping the newest 500 and at most
  2 GB. Clicking a view sends a message in that chat.
author: Revenue-Architect
license: MIT
homepage: https://github.com/Revenue-Architect/hermes-kaizen-ui
requires_hermes: ">=0.23.0"
provides_tools:
  - a2ui_present
provides_hooks:
  - pre_llm_call
  - transform_llm_output
requires_env: []
