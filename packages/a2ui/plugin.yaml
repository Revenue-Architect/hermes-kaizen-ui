manifest_version: 2
api_version: 1
name: hermes-a2ui
version: "1.0.0"
description: >-
  Draws interactive A2UI v0.9 views in the Hermes Desktop and Webapp chat, with one validated tool and
  a text fallback for other clients. Disclosure: no network, subprocesses or credentials. Saves each
  view in the plugin's data folder, keeping the newest 500. Clicking a view sends a message in that chat.
author: Revenue-Architect
license: MIT
homepage: https://github.com/Revenue-Architect/hermes-kaizen-ui
requires_hermes: ">=0.23.0"
provides_tools:
  - a2ui_present
provides_hooks:
  - pre_llm_call
  - transform_llm_output
requires_env: []
