manifest_version: 2
api_version: 1
name: hermes-openui
version: "1.1.1"
description: >-
  Draws interactive OpenUI views and live dashboards in the Hermes Desktop and Webapp chat, with one
  tool and a text fallback for other clients. Disclosure: no network calls of its own, subprocesses or
  credentials. A view can load https images the model names. Reads the local image files the model names
  and stores a copy in that view's file. A dashboard on screen automatically reads the MCP tools the user
  lists in dashboard_sources, through Hermes' own MCP client; nothing is read until the user lists a source.
  Saves each view in the plugin's data folder, keeping the newest 500 and at most 2 GB, plus one backend id
  file. Clicking a view sends a message in that chat.
author: Revenue-Architect
license: MIT
homepage: https://github.com/Revenue-Architect/hermes-kaizen-ui
requires_hermes: ">=0.23.0"
provides_tools:
  - openui_present
provides_hooks:
  - pre_llm_call
  - transform_llm_output
requires_env: []
